name: h8-runtime-smoke

on:
  pull_request:
    paths:
      - 'src/Sts2Emulator.Core/H8CombatRuntimeV1.cs'
      - 'src/Sts2Emulator.Core/H8NativePhysicalDrawEngineV1.cs'
      - 'src/Sts2Emulator.Core/H8NativePlayerEndTurnEngineV1.cs'
      - 'src/Sts2Emulator.Core/SemanticEndTurnV111.cs'
      - 'src/Sts2Emulator.Core/SemanticPilotCombatV111.cs'
      - 'src/Sts2Emulator.Core/SemanticDeckStateV111.cs'
      - 'tests/Sts2Emulator.Core.Tests/H8CombatRuntimeV1Tests.cs'
      - 'tests/Sts2Emulator.Core.Tests/SemanticDeckStateV111Tests.cs'
      - 'src/Sts2Emulator.Cli/PrototypeAiJsonlServer.cs'
      - 'tests/test_h8_runtime_jsonl.py'
      - 'tests/test_h8_benchmark_sessions.py'
      - 'tools/benchmark_h8_sessions.py'
      - '.github/workflows/h8-runtime-smoke.yml'
  workflow_dispatch:

jobs:
  real-a10-versioned-boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - name: Build emulator
        run: |
          dotnet restore Sts2Emulator.sln
          dotnet build Sts2Emulator.sln -c Release --no-restore -m:1
      - name: Real source-valid A10 H8 draw/replay and old checked draw parity
        run: |
          dotnet test Sts2Emulator.sln -c Release --no-build -m:1 \
            --filter 'FullyQualifiedName~H8CombatRuntimeV1Tests|FullyQualifiedName~SemanticDeckStateV111Tests|FullyQualifiedName~CanonicalJsonTests' \
            --logger 'console;verbosity=detailed'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: H8 versioned JSONL external session and replay audit
        env:
          STS2_EMULATOR_DLL: ${{ github.workspace }}/src/Sts2Emulator.Cli/bin/Release/net9.0/Sts2Emulator.Cli.dll
        run: |
          python -m unittest discover -s tests -p 'test_h8_runtime_jsonl.py' -v
      - name: H8 versioned-session benchmark pair, source and replay invariants
        env:
          STS2_EMULATOR_DLL: ${{ github.workspace }}/src/Sts2Emulator.Cli/bin/Release/net9.0/Sts2Emulator.Cli.dll
        run: |
          python -m unittest discover -s tests -p 'test_h8_benchmark_sessions.py' -v
          python tools/benchmark_h8_sessions.py \
            --emulator-dll "$STS2_EMULATOR_DLL" \
            --emulator-bindings bindings/python \
            --emulator-revision "$GITHUB_SHA" \
            --workers 2 --episodes 2 --max-boundaries 25 \
            --replay-every 1 --order ab \
            --output /tmp/h8-session-ab.json
