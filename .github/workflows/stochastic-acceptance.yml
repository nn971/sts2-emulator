name: stochastic-acceptance

on:
  push:
    branches:
      - audit/stochastic-acceptance-20261026
  pull_request:
    paths:
      - '.github/workflows/stochastic-acceptance.yml'
      - 'src/**'
      - 'tests/**'
      - 'tools/**'

jobs:
  structural:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - name: Build independently of fidelity
        run: dotnet build Sts2Emulator.sln -c Release
      - name: RNG site, information boundary and ownership guards
        run: |
          python tools/rng_callsite_inventory.py --help
          python tools/rng_callsite_inventory.py --check-site-matrix --check-s0-contract-links --check-no-ambient-entropy --check-no-native-chance-law-dependency --check-chance-law-outcome-blind --check-draw-kernel-callsite-ownership --format json > stochastic-inventory.json
          python tools/stochastic_coverage_gate.py --out stochastic-coverage.json
      - name: Structural / mathematical reference-law tests (must pass)
        run: |
          dotnet test tests/Sts2Emulator.Core.Tests/Sts2Emulator.Core.Tests.csproj -c Release --no-build --filter 'FullyQualifiedName~SemanticDeckStateV111Tests|FullyQualifiedName~RandomBoundaryJournalV111Tests|FullyQualifiedName~StochasticProviderDifferentialAcceptanceTests' --logger 'trx;LogFileName=structural.trx'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stochastic-structural-evidence
          path: |
            stochastic-inventory.json
            stochastic-coverage.json
            tests/**/TestResults/*.trx

  regression-inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - name: Build
        run: dotnet build Sts2Emulator.sln -c Release
      - name: Record all current failures without claiming they are inherited
        shell: bash
        run: |
          dotnet test tests/Sts2Emulator.Core.Tests/Sts2Emulator.Core.Tests.csproj -c Release --no-build --logger 'trx;LogFileName=stochastic-current.trx' || true
          python tools/stochastic_regression_report.py --current tests/Sts2Emulator.Core.Tests/TestResults/stochastic-current.trx --output stochastic-current-report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stochastic-regression-evidence
          path: |
            stochastic-current-report.json
            tests/**/TestResults/*.trx
