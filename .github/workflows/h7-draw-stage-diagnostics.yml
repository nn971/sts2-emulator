name: h7-draw-stage-diagnostics
on:
  pull_request:
    paths:
      - 'src/Sts2Emulator.Core/SemanticDrawStageProfilerV111.cs'
      - 'src/Sts2Emulator.Core/SemanticPilotCombatV111.cs'
      - 'src/Sts2Emulator.Core/SemanticEndTurnV111.cs'
      - 'src/Sts2Emulator.Core/SemanticCombatDrawV111.cs'
      - 'src/Sts2Emulator.Core/CanonicalJson.cs'
      - 'src/Sts2Emulator.Cli/PrototypeAiJsonlServer.cs'
      - 'tools/report_draw_stage_perf.py'
      - '.github/workflows/h7-draw-stage-diagnostics.yml'
  workflow_dispatch:

jobs:
  real-a10-draw-stages:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          path: emulator
      - uses: actions/checkout@v4
        with:
          repository: nn971/sts2-ai
          ref: research/h7-sampled-terminal-replay-20261027
          path: ai
          submodules: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build instrumented emulator
        working-directory: emulator
        run: |
          dotnet restore Sts2Emulator.sln
          dotnet build Sts2Emulator.sln -c Release --no-restore -m:1
      - name: Focused canonical-hash and verified-draw invariants
        working-directory: emulator
        run: |
          dotnet test Sts2Emulator.sln -c Release --no-build -m:1 \
            --filter 'FullyQualifiedName~CanonicalJsonTests|FullyQualifiedName~SemanticPilotCombatV111Tests.SemanticDrawResolvesByEventAndCardIdentityAndReplaysTypedDecision'
      - name: Install lightweight H7 actor, Python tests
        working-directory: ai
        run: |
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[dev]'
      - name: Real 16-cell A10 semantic draws, opt-in nested profiling
        working-directory: ai
        env:
          STS2_SEMANTIC_PROFILE_DIR: ../profiles
          # Fail if optimized passive event inspection disagrees with the
          # unchanged reference on any real A10 JSONL boundary.
          STS2_H7_COMPARE_BOUNDARY_INSPECTION: '1'
          # CI only: recalculate every memo hit from scratch, failing closed
          # if any RunState instance changed during validation.
          STS2_H7_VERIFY_RUN_HASH_REUSE: '1'
          # Rehash inherited opening provenance to prove it is immutable
          # across status calls, forks, draw and intent continuations.
          STS2_H7_VERIFY_SOURCE_OPENING_HASH_REUSE: '1'
        run: |
          mkdir -p ../profiles ../reports
          python -u tools/benchmark_h7_rollouts.py \
            --emulator-dll ../emulator/src/Sts2Emulator.Cli/bin/Release/net9.0/Sts2Emulator.Cli.dll \
            --emulator-bindings ../emulator/bindings/python \
            --emulator-revision $(git -C ../emulator rev-parse HEAD) \
            --output ../reports/h7.json \
            --episodes 16 --workers 2 \
            --actor-backend local --actor-device cpu \
            --width 32 --layers 1 --heads 4 --feedforward 64 \
            --study-seed 73127 --actor-seed 31337 --reference-seed 23387
          python ../emulator/tools/summarize_semantic_perf.py \
            ../profiles --output ../reports/native.json
          python ../emulator/tools/report_draw_stage_perf.py \
            ../reports/native.json > ../reports/draw-stages.txt
          cat ../reports/draw-stages.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: h7-draw-stage-16-real-combats
          path: |
            reports/h7.json
            reports/native.json
            reports/draw-stages.txt
          if-no-files-found: ignore
