name: v111-fidelity-integration

on:
  push:
    branches:
      - integration/fidelity-rng-on-silent-all-act-v111
  pull_request:

jobs:
  rng-inspector-regressions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - name: Restore
        run: dotnet restore Sts2Emulator.sln
      - name: Build complete newer all-Act engine
        run: dotnet build Sts2Emulator.sln -c Release --no-restore
      - name: Compile offline native PE metadata contract reader
        run: |
          dotnet build tools/NativeV111MetadataProbe/NativeV111MetadataProbe.csproj -c Release --nologo
          set +e
          dotnet run --project tools/NativeV111MetadataProbe/NativeV111MetadataProbe.csproj -c Release --verbosity quiet -- src/Sts2Emulator.Core/bin/Release/net9.0/Sts2Emulator.Core.dll > /tmp/native-metadata-negative-fixture.json
          result=$?
          set -e
          test "$result" -eq 2
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("/tmp/native-metadata-negative-fixture.json").read_text())
          assert report["schema"] == "sts2-native-metadata-contract-v1"
          assert report["status"] == "NATIVE_METADATA_MEMBERS_MISSING"
          assert report["native_game_executed"] is False
          assert any(not check["present"] for check in report["checks"])
          PY
      - name: RNG, native Inspector and actual-engine fidelity unit tests
        run: |
          dotnet test Sts2Emulator.sln -c Release --no-build --filter 'FullyQualifiedName~RandomBoundaryJournalV111Tests|FullyQualifiedName~RandomIndexProvidersV111Tests|FullyQualifiedName~RandomIntentProviderV111Tests|FullyQualifiedName~ControlledInitialHpV111Tests|FullyQualifiedName~ControlledIntentsV111Tests|FullyQualifiedName~NativeInitialHpRollEvidenceV111Tests|FullyQualifiedName~NativeShuffleSourceImportV111Tests|FullyQualifiedName~NativeShuffleStepFidelityV111Tests|FullyQualifiedName~NativeFisherYatesV111Tests|FullyQualifiedName~NativeShuffleOperationEvidenceV111Tests|FullyQualifiedName~NativeRngCallsiteScopesV111Tests|FullyQualifiedName~NativeRngSourceRegistryV111Tests|FullyQualifiedName~NativeAgentBoundaryFeedTests|FullyQualifiedName~NativeRngScalarEvidenceV111Tests|FullyQualifiedName~NativeRngStreamCheckpointV111Tests|FullyQualifiedName~NativeActionEnvelopeRecorderTests|FullyQualifiedName~NativeRunPreludeRecorderTests|FullyQualifiedName~NativeStandardActMapV111Tests|FullyQualifiedName~NativeObservedMapV111Tests|FullyQualifiedName~NativeObservedFirstCombatActionsV111Tests|FullyQualifiedName~NativeObservedTurnCheckpointsV111Tests|FullyQualifiedName~NativeSilentPotionGenerationV111Tests|FullyQualifiedName~NativeUpFrontRelicBagsV111Tests|FullyQualifiedName~NativeUpFrontRoomsV111Tests|FullyQualifiedName~NativeStartupRoomQueueCapturedEvidenceV111Tests|FullyQualifiedName~NativeEventRngV111Tests|FullyQualifiedName~NativeNeowOfferV111Tests|FullyQualifiedName~NativeEngineFidelityV111Tests|FullyQualifiedName~NativeEngineFidelityBatchV111Tests'
      - name: Native Inspector strict and sidecar audit tools
        run: python -m unittest discover -s tests -p 'test_native_*.py' -v
      - name: Unified gate and explicit source RNG first-divergence tests
        run: python -m unittest discover -s tests -p 'test_unified_native_rng_fidelity_gate.py' -v
      - name: Controlled isolated Nature HP-intent JSONL bridge
        run: python tools/nature_jsonl_smoke.py
      - name: Persistent emulator shadow session (emulator-derived synthetic source only)
        run: python tools/native_lockstep_shadow_jsonl_smoke.py
      - name: Persistent emulator turn-start replay (emulator-derived synthetic source only)
        run: python tools/native_turn_checkpoint_jsonl_smoke.py
      - name: Independent native prelude bootstrap and native Neow RNG reconstruction offline tests
        run: python -m unittest discover -s tests -p 'test_native_run_bootstrap.py' -v
      - name: Independent run-start to first-combat emulator JSONL smoke (synthetic source only)
        run: python tools/native_run_bootstrap_jsonl_smoke.py
      - name: Independent native Neow RNG source predictor smoke
        run: python tools/native_neow_rng_probe_smoke.py
      - name: Real emulator JSONL native-map snapshot schema and RNG-difference smoke (synthetic source only)
        run: python tools/native_map_fidelity_jsonl_smoke.py
