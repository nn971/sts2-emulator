name: v111-fidelity-integration

on:
  push:
    branches:
      - integration/fidelity-rng-on-silent-all-act-v111
  pull_request:

jobs:
  rng-inspector-regressions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - name: Restore
        run: dotnet restore Sts2Emulator.sln
      - name: Build complete newer all-Act engine
        run: dotnet build Sts2Emulator.sln -c Release --no-restore
      - name: RNG, native Inspector and actual-engine fidelity unit tests
        run: |
          dotnet test Sts2Emulator.sln -c Release --no-build --filter 'FullyQualifiedName~RandomBoundaryJournalV111Tests|FullyQualifiedName~RandomIndexProvidersV111Tests|FullyQualifiedName~RandomIntentProviderV111Tests|FullyQualifiedName~ControlledInitialHpV111Tests|FullyQualifiedName~ControlledIntentsV111Tests|FullyQualifiedName~NativeInitialHpRollEvidenceV111Tests|FullyQualifiedName~NativeShuffleSourceImportV111Tests|FullyQualifiedName~NativeShuffleStepFidelityV111Tests|FullyQualifiedName~NativeFisherYatesV111Tests|FullyQualifiedName~NativeShuffleOperationEvidenceV111Tests|FullyQualifiedName~NativeRngCallsiteScopesV111Tests|FullyQualifiedName~NativeRngSourceRegistryV111Tests|FullyQualifiedName~NativeAgentBoundaryFeedTests|FullyQualifiedName~NativeRngScalarEvidenceV111Tests|FullyQualifiedName~NativeRngStreamCheckpointV111Tests|FullyQualifiedName~NativeActionEnvelopeRecorderTests|FullyQualifiedName~NativeEngineFidelityV111Tests|FullyQualifiedName~NativeEngineFidelityBatchV111Tests'
      - name: Native Inspector strict and sidecar audit tools
        run: python -m unittest discover -s tests -p 'test_native_*.py' -v
      - name: Unified gate and explicit source RNG first-divergence tests
        run: python -m unittest discover -s tests -p 'test_unified_native_rng_fidelity_gate.py' -v
      - name: Controlled isolated Nature HP-intent JSONL bridge
        run: python tools/nature_jsonl_smoke.py
