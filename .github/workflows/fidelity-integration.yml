name: v111-fidelity-integration

on:
  push:
    branches:
      - integration/fidelity-rng-on-silent-all-act-v111
  pull_request:

jobs:
  rng-inspector-regressions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - name: Restore
        run: dotnet restore Sts2Emulator.sln
      - name: Build complete newer all-Act engine
        run: dotnet build Sts2Emulator.sln -c Release --no-restore
      - name: RNG, native Inspector and actual-engine fidelity unit tests
        run: |
          dotnet test Sts2Emulator.sln -c Release --no-build --filter 'FullyQualifiedName~RandomBoundaryJournalV111Tests|FullyQualifiedName~RandomIndexProvidersV111Tests|FullyQualifiedName~RandomIntentProviderV111Tests|FullyQualifiedName~ControlledInitialHpV111Tests|FullyQualifiedName~ControlledIntentsV111Tests|FullyQualifiedName~NatureBoundaryMetadataV111Tests|FullyQualifiedName~ControlledPlayableCombatV111Tests|FullyQualifiedName~ControlledLiveTurnIntentsV111Tests|FullyQualifiedName~ControlledLiveRecycleV111Tests|FullyQualifiedName~ControlledRandomTargetV111Tests|FullyQualifiedName~ControlledGeneratedCardV111Tests|FullyQualifiedName~ControlledDrawInsertionV111Tests|FullyQualifiedName~ControlledPoolShuffleV111Tests|FullyQualifiedName~ControlledRandomCostV111Tests|FullyQualifiedName~ControlledDrawCostV111Tests|FullyQualifiedName~SemanticDeckStateV111Tests|FullyQualifiedName~SemanticCombatDrawV111Tests|FullyQualifiedName~SemanticCombatDrawCostV111Tests|FullyQualifiedName~SemanticAutomaticHandDrawV111Tests|FullyQualifiedName~SemanticEndTurnV111Tests|FullyQualifiedName~SemanticPersistentPlayerActionV111Tests|FullyQualifiedName~SemanticCardSelectionV111Tests|FullyQualifiedName~SemanticPilotCombatV111Tests|FullyQualifiedName~SemanticOtherChanceV111Tests|FullyQualifiedName~NativeInitialHpRollEvidenceV111Tests|FullyQualifiedName~NativeShuffleSourceImportV111Tests|FullyQualifiedName~NativeShuffleStepFidelityV111Tests|FullyQualifiedName~NativeFisherYatesV111Tests|FullyQualifiedName~NativeShuffleOperationEvidenceV111Tests|FullyQualifiedName~NativeRngCallsiteScopesV111Tests|FullyQualifiedName~NativeRngSourceRegistryV111Tests|FullyQualifiedName~NativeActionEnvelopeRecorderTests|FullyQualifiedName~NativeEngineFidelityV111Tests|FullyQualifiedName~NativeEngineFidelityBatchV111Tests'
      - name: Native Inspector strict and sidecar audit tools
        run: python -m unittest discover -s tests -p 'test_native_*.py' -v
      - name: Unified gate and explicit source RNG first-divergence tests
        run: python -m unittest discover -s tests -p 'test_unified_native_rng_fidelity_gate.py' -v
      - name: Controlled isolated Nature HP-intent JSONL bridge
        run: python tools/nature_jsonl_smoke.py
      - name: Nature playable-entry fixture smoke
        run: python tools/nature_playable_jsonl_smoke.py
      - name: Nature live end-turn suspension and replay
        run: python tools/nature_live_turn_jsonl_smoke.py
      - name: Nature live draw-recycle suspension and replay
        run: python tools/nature_live_recycle_jsonl_smoke.py
      - name: P0 playable semantic intent/draw Python JSONL handshake and replay
        run: python tools/nature_semantic_p0_jsonl_smoke.py
      - name: P0 independent seeded semantic JSONL setup and 15-process equality
        run: python tools/nature_semantic_seeded_jsonl_smoke.py
      - name: P0 source-routed Nature/native policy comparison and 15-process replay
        run: python tools/nature_semantic_victory_jsonl_smoke.py
