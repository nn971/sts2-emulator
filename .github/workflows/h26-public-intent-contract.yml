name: h26-public-intent-contract

on:
  pull_request:
    paths:
      - 'src/Sts2Emulator.Core/PublicEnemyIntentCatalogV111.cs'
      - 'src/Sts2Emulator.Cli/Program.cs'
      - 'tests/Sts2Emulator.Core.Tests/PublicEnemyIntentCatalogV111Tests.cs'
      - '.github/workflows/h26-public-intent-contract.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  catalog-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - name: Compile and test public-intent catalog only
        run: |
          dotnet test tests/Sts2Emulator.Core.Tests/Sts2Emulator.Core.Tests.csproj \
            --filter FullyQualifiedName~PublicEnemyIntentCatalogV111Tests \
            --verbosity quiet
      - name: Export rules and verify JSON schema
        run: |
          dotnet run --project src/Sts2Emulator.Cli/Sts2Emulator.Cli.csproj \
            -- public-intent-catalog-v111 > /tmp/h26-catalog.json
          python3 - <<'PY'
          import json
          with open("/tmp/h26-catalog.json") as f:
              obj = json.load(f)
          assert obj["schema"] == "sts2-h26-public-intent-rules-v1"
          assert obj["probability_denominator"] > 0
          assert obj["enemies"]
          assert obj["native_next_int_weights"]
          PY
